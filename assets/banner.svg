<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Unlimited OCR Everywhere</title>
  <desc id="desc">One model. Every device. Unlimited pages. Run Baidu Unlimited-OCR-2 on Colab, NVIDIA GPUs, CPUs and Apple Silicon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#0d2138"/>
      <stop offset="1" stop-color="#073b45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de2c5"/>
      <stop offset="0.55" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#20d9c3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#20d9c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7dd3fc" fill-opacity="0.10"/>
    </pattern>
    <g id="doc">
      <rect x="0" y="0" width="150" height="196" rx="14" fill="#0b1a2b" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <rect x="20" y="26" width="70" height="8" rx="4" fill="#4de2c5" fill-opacity="0.85"/>
      <rect x="20" y="48" width="110" height="5" rx="2.5" fill="#e2e8f0" fill-opacity="0.38"/>
      <rect x="20" y="62" width="96" height="5" rx="2.5" fill="#e2e8f0" fill-opacity="0.28"/>
      <rect x="20" y="76" width="106" height="5" rx="2.5" fill="#e2e8f0" fill-opacity="0.24"/>
      <rect x="20" y="98" width="52" height="34" rx="6" fill="#0ea5a0" fill-opacity="0.28" stroke="#4de2c5" stroke-opacity="0.4"/>
      <rect x="80" y="98" width="50" height="34" rx="6" fill="#ffd166" fill-opacity="0.16" stroke="#ffd166" stroke-opacity="0.35"/>
      <rect x="20" y="146" width="110" height="5" rx="2.5" fill="#e2e8f0" fill-opacity="0.28"/>
      <rect x="20" y="160" width="84" height="5" rx="2.5" fill="#e2e8f0" fill-opacity="0.22"/>
      <path d="M112 178 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#ffd166" fill-opacity="0.9"/>
    </g>
    <g id="pill">
      <rect x="0" y="0" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    </g>
  </defs>

  <rect width="1200" height="320" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <ellipse cx="1080" cy="70" rx="240" ry="190" fill="url(#glow1)" filter="url(#soft)"/>
  <ellipse cx="980" cy="300" rx="260" ry="160" fill="url(#glow2)" filter="url(#soft)"/>

  <g opacity="0.9">
    <text x="64" y="64" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.2" fill="#7dd3fc">BAIDU UNLIMITED-OCR-2</text>
    <text x="64" y="138" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">Unlimited OCR</text>
    <text x="64" y="200" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#accent)">Everywhere</text>
    <text x="66" y="238" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">One model. Every device. Unlimited pages.</text>
  </g>

  <g transform="translate(64 262)">
    <g transform="translate(0 0)"><use href="#pill"/><text x="59" y="20" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">Colab T4</text></g>
    <g transform="translate(128 0)"><use href="#pill"/><text x="59" y="20" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">L4 / A100</text></g>
    <g transform="translate(256 0)"><use href="#pill"/><text x="59" y="20" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">NVIDIA PC</text></g>
    <g transform="translate(384 0)"><use href="#pill"/><text x="59" y="20" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">CPU</text></g>
    <g transform="translate(512 0)"><use href="#pill"/><text x="59" y="20" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">Apple Silicon</text></g>
    <g transform="translate(640 0)"><use href="#pill"/><text x="59" y="20" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">SGLang</text></g>
  </g>

  <g transform="translate(905 58) rotate(4)">
    <use href="#doc"/>
  </g>
  <g transform="translate(985 150) rotate(-5)">
    <use href="#doc" opacity="0.55"/>
  </g>
  <g transform="translate(1008 28)">
    <rect x="0" y="0" width="126" height="34" rx="17" fill="#4de2c5" fill-opacity="0.14" stroke="#4de2c5" stroke-opacity="0.5"/>
    <text x="63" y="22" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#5eead4">PDF → MD</text>
  </g>
</svg>
