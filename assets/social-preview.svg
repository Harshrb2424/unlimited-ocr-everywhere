<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Unlimited OCR Everywhere - social preview</title>
  <desc id="desc">One model. Every device. Unlimited pages. Notebooks for Colab T4, L4/A100, NVIDIA PCs, CPU and Apple Silicon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c18"/>
      <stop offset="0.5" stop-color="#0b1e33"/>
      <stop offset="1" stop-color="#06343d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de2c5"/>
      <stop offset="0.55" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#20d9c3" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#20d9c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7dd3fc" fill-opacity="0.09"/>
    </pattern>
    <g id="doc">
      <rect x="0" y="0" width="220" height="286" rx="20" fill="#0b1a2b" stroke="#2dd4bf" stroke-opacity="0.55"/>
      <rect x="28" y="36" width="104" height="11" rx="5.5" fill="#4de2c5" fill-opacity="0.9"/>
      <rect x="28" y="66" width="162" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.38"/>
      <rect x="28" y="86" width="140" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.28"/>
      <rect x="28" y="106" width="156" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.24"/>
      <rect x="28" y="138" width="76" height="48" rx="9" fill="#0ea5a0" fill-opacity="0.28" stroke="#4de2c5" stroke-opacity="0.4"/>
      <rect x="118" y="138" width="72" height="48" rx="9" fill="#ffd166" fill-opacity="0.16" stroke="#ffd166" stroke-opacity="0.35"/>
      <rect x="28" y="208" width="162" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.28"/>
      <rect x="28" y="228" width="120" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.22"/>
      <path d="M166 252 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8z" fill="#ffd166" fill-opacity="0.92"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="1080" cy="120" rx="380" ry="300" fill="url(#glow1)" filter="url(#soft)"/>
  <ellipse cx="980" cy="580" rx="420" ry="280" fill="url(#glow2)" filter="url(#soft)"/>

  <g>
    <text x="80" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#7dd3fc">BAIDU UNLIMITED-OCR-2</text>
    <text x="80" y="222" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2.5" fill="#f8fafc">Unlimited OCR</text>
    <text x="80" y="314" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="-2.5" fill="url(#accent)">Everywhere</text>
    <text x="84" y="382" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">One model. Every device. Unlimited pages.</text>
    <text x="84" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Download a notebook, run all, get clean Markdown from any PDF.</text>
  </g>

  <g transform="translate(84 492)">
    <g><rect width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="75" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#d1fae5">Colab T4</text></g>
    <g transform="translate(166 0)"><rect width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="75" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#d1fae5">L4 / A100</text></g>
    <g transform="translate(332 0)"><rect width="170" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="85" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#d1fae5">NVIDIA PC</text></g>
    <g transform="translate(518 0)"><rect width="120" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="60" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#d1fae5">CPU</text></g>
    <g transform="translate(654 0)"><rect width="190" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="95" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#d1fae5">Apple Silicon</text></g>
    <g transform="translate(860 0)"><rect width="140" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="70" y="27" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#d1fae5">SGLang</text></g>
  </g>

  <g transform="translate(920 150) rotate(4)">
    <use href="#doc"/>
  </g>
  <g transform="translate(1000 286) rotate(-5)">
    <use href="#doc" opacity="0.45"/>
  </g>
  <g transform="translate(900 102)">
    <rect width="164" height="44" rx="22" fill="#4de2c5" fill-opacity="0.14" stroke="#4de2c5" stroke-opacity="0.5"/>
    <text x="82" y="29" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#5eead4">PDF → MD</text>
  </g>
</svg>
