version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # The model's remote code is pinned to transformers 4.52.1. Keep that pin
    # deliberate instead of letting Dependabot bump it automatically.
    ignore:
      - dependency-name: "transformers"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
